<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fffdf9">
<title>山屋 · 户型装修室内设计</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <script type="importmap">
  {
    "imports": {
    "three":"./assets/lib/three/build/three.module.min.js",
      "three/addons/":"./assets/lib/three/examples/jsm/"
    }
  }
  </script>
  <script>
  try {
    const panes = JSON.parse(localStorage.getItem('huxing-panes') || '{}');
    const root = document.documentElement;
    if (panes.leftMode === 'none' || (panes.leftMode == null && panes.hideLib)) root.classList.add('prehide-lib');
    if (panes.hidePanel) root.classList.add('prehide-panel');
  } catch (e) {}
  </script>
</head>
<body>
<div class="app">
  <header>
    <div class="grp" id="paneBtns">
      <button class="btn chip" id="tgPlan">户型</button>
      <button class="btn chip" id="tgLib">家具库</button>
      <button class="btn chip" id="tgPanel">属性</button>
    </div>
    <div class="brand"><b>山屋 · 户型装修室内设计</b><span id="subtitle">尺寸单位 mm</span></div>
    <div class="grp seg" id="viewSeg" title="切换 2D / 3D (T)">
      <span class="pill"></span>
      <button class="btn" data-view="2d">2D 平面</button>
      <button class="btn" data-view="3d">3D 场景</button>
    </div>
    <div class="grp only2d" id="tools">
      <button class="btn on" data-tool="select" title="选择 / 移动 (V)">选择</button>
      <button class="btn" data-tool="measure" title="测量 (M)">测量</button>
    </div>
    <div class="grp only2d">
      <button class="btn" id="zoomOut" title="缩小">−</button>
      <button class="btn" id="zoomIn" title="放大">＋</button>
      <button class="btn" id="fit" title="适应窗口 (F)">适应</button>
      <button class="btn" id="s60" title="按 1:60 显示（与原图同比例）">1:60</button>
      <button class="btn" id="s100" title="按 1:100 显示">1:100</button>
    </div>
    <div class="grp only3d" id="modes3d">
      <button class="btn on" data-mode="orbit">鸟瞰</button>
      <button class="btn" data-mode="walk">漫游</button>
    </div>
    <div class="grp only3d">
      <button class="btn" id="vIso">斜视</button>
      <button class="btn" id="vTop">俯视</button>
    </div>
    <div class="grp">
      <button class="btn" id="undo" title="撤销 (Ctrl+Z)">撤销</button>
      <button class="btn" id="redo" title="重做 (Ctrl+Shift+Z)">重做</button>
      <button class="btn danger" id="clearAll" title="清空所有家具家电（可撤销）">清空家具</button>
      <button class="btn danger" id="clearCanvas" title="清空整个画布（可撤销）">清空画布</button>
    </div>
    <div class="grp only2d" id="layers">
      <button class="btn chip on" data-layer="dims">尺寸</button>
      <button class="btn chip on" data-layer="labels">房间</button>
      <button class="btn chip on" data-layer="furn">家具</button>
      <button class="btn chip on" data-layer="grid">网格</button>
      <button class="btn chip on" data-layer="bearing">承重墙</button>
      <button class="btn chip on" data-layer="wallSnap" title="绘制和移动时启用吸附">吸附</button>
    </div>
    <div class="grp only3d">
      <button class="btn chip on" data-cut="2.8">全高墙</button>
      <button class="btn chip" data-cut="1.2">剖切墙</button>
    </div>
    <div class="grp only3d" id="toggles3d">
      <button class="btn chip on" data-t="furn">家具</button>
      <button class="btn chip on" data-t="labels">房间名</button>
      <button class="btn chip" data-t="night">夜景</button>
    </div>
    <div class="grp only3d"><label class="range"><span>日照</span> <input type="range" id="sun" min="7" max="18" step=".25" value="10" style="width:84px"><span id="sunT">10:00</span></label></div>
    <div class="spacer"></div>
    <button class="btn" id="fullscreen" title="全屏 (Shift+F)" style="border:1px solid var(--line);background:#fff">⛶ 全屏</button>
    <details class="menu"><summary class="btn">文件 ▾</summary>
      <div class="menu-pop">
        <button class="btn" id="exportPng">导出图片</button>
        <button class="btn" id="exportJson">导出方案 JSON</button>
        <button class="btn" id="importJson">导入方案</button>
      </div></details>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </header>

  <aside class="lib">
    <div id="planTools" class="plan-tools" hidden>
      <h4>绘制房间</h4>
      <div class="plan-grid">
        <button class="plan-item" data-plan-tool="room-rect"><b aria-hidden="true"></b><span>房间矩形</span><small>拖拽绘制矩形</small></button>
        <button class="plan-item" data-plan-tool="room"><b aria-hidden="true"></b><span>房间多边形</span><small>拖拽绘制多边形</small></button>
      </div>
      <h4>绘制墙体</h4>
      <div class="plan-grid">
        <button class="plan-item" data-plan-tool="wall" data-plan-type="n"><b aria-hidden="true"></b><span>普通墙</span><small>水平 / 垂直吸附</small></button>
        <button class="plan-item" data-plan-tool="wall" data-plan-type="b"><b aria-hidden="true"></b><span>承重墙</span><small>不可拆除</small></button>
        <button class="plan-item" data-plan-tool="wall" data-plan-type="e"><b aria-hidden="true"></b><span>外墙</span><small>建筑外围护</small></button>
        <button class="plan-item" data-plan-tool="wall" data-plan-type="low"><b aria-hidden="true"></b><span>矮墙</span><small>低墙 / 半墙</small></button>
      </div>
      <h4>绘制窗户</h4>
      <div class="plan-grid">
        <button class="plan-item" data-plan-tool="window" data-plan-type="normal"><b aria-hidden="true"></b><span>普通窗</span><small>标准窗洞</small></button>
        <button class="plan-item" data-plan-tool="window" data-plan-type="floor"><b aria-hidden="true"></b><span>落地窗</span><small>低窗台</small></button>
        <button class="plan-item" data-plan-tool="window" data-plan-type="bay"><b aria-hidden="true"></b><span>飘窗</span><small>外凸窗台</small></button>
        <button class="plan-item" data-plan-tool="window" data-plan-type="sliding"><b aria-hidden="true"></b><span>滑动门窗</span><small>双扇滑动开启</small></button>
      </div>
      <h4>绘制门</h4>
      <div class="plan-grid">
        <button class="plan-item" data-plan-tool="door" data-plan-type="in-left"><b aria-hidden="true"></b><span>内开 · 左铰链</span><small>拖出门洞</small></button>
        <button class="plan-item" data-plan-tool="door" data-plan-type="in-right"><b aria-hidden="true"></b><span>内开 · 右铰链</span><small>拖出门洞</small></button>
        <button class="plan-item" data-plan-tool="door" data-plan-type="out-left"><b aria-hidden="true"></b><span>外开 · 左铰链</span><small>拖出门洞</small></button>
        <button class="plan-item" data-plan-tool="door" data-plan-type="out-right"><b aria-hidden="true"></b><span>外开 · 右铰链</span><small>拖出门洞</small></button>
      </div>
      <div class="hint">开启“吸附”后，绘制点会吸附到网格、实体端点 / 边中点和水平 / 垂直方向；边长会实时显示。绘制完成后自动回到编辑状态；点击画布中的对象即可修改属性。</div>
    </div>
    <div id="lib3d" class="only3d">
      <h4>房间 · 点击飞到该房间</h4>
      <div id="roomList"></div>
    </div>
    <div id="lib"></div>
  </aside>

  <main id="stage">
    <svg id="plan" class="tool-select" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
      <defs id="defs"></defs>
      <g id="gGrid"></g>
      <g id="gRooms"></g>
      <g id="gFurn"></g>
      <g id="gWalls"></g>
      <g id="gOpen"></g>
      <g id="gLabels" pointer-events="none"></g>
      <g id="gDims" pointer-events="none"></g>
      <g id="gMeasure" pointer-events="none"></g>
      <g id="gDraft" pointer-events="none"></g>
      <g id="gSel"></g>
    </svg>
    <div id="view3d">
      <div id="walkOverlay"><div><h3>漫游模式</h3>
        <p id="wo1"></p>
        <p id="wo2"></p>
        <p id="wo3"></p></div></div>
      <div id="cross"></div>
      <div id="joy"><i></i></div>
      <button class="btn primary" id="walkExit">退出漫游</button>
      <div id="hint3d"></div>
    </div>
    <div class="scalebar" id="scalebar"><span id="sbText">1 m</span><div class="bar" id="sbBar"></div></div>
    <div class="modehint" id="modehint"></div>
    <div id="fab"></div>
  </main>

  <aside class="right"><div id="panel"></div></aside>

  <footer>
    <span class="only2d">X <b id="cx">—</b></span><span class="only2d">Y <b id="cy">—</b></span>
    <span class="only2d"><span>当前比例</span> <b id="ratio">—</b></span>
    <span id="hover" class="only2d"></span>
    <span class="spacer"></span>
    <span id="tip"></span>
  </footer>
</div>
<div id="toast"></div>

  <script type="module" src="assets/js/app.js"></script>
  <script type="module" src="assets/js/plan-editor.js"></script>
  <script type="module" src="assets/js/scene3d.js"></script>
</body>
</html>
